trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

variables:
  buildConfiguration: 'Release'
  dotnetVersion: '10.0.x'
  githubOwner: 'POPWorldMedia'
  functionAppName: 'popforumsdevfunctions'
  webAppName: 'popforumsdev'
  azureServiceConnection: 'popforums-azure'

stages:
  - stage: Build
    displayName: 'Build, test, pack & publish artifacts'
    jobs:
      - job: BuildAndTest
        pool:
          vmImage: 'ubuntu-latest'
        variables:
          - group: popforums-github-packages
        steps:
          # Must run before "dotnet build": ASP.NET Core's static web assets embedding
          # scans wwwroot during build itself, so Mvc's lib/css assets have to already be
          # in place before that build step runs, or they're silently missing from the
          # static assets manifest even though the files exist on disk afterward.
          - task: UseNode@1
            displayName: 'Use Node.js'
            condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
            inputs:
              version: '20.x'

          - script: |
              set -e
              npm install
              npx gulp copies
              npx gulp css
            displayName: 'Build Mvc front-end assets'
            condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
            workingDirectory: 'src/PopForums.Mvc'

          - task: UseDotNet@2
            displayName: 'Use .NET $(dotnetVersion)'
            inputs:
              version: '$(dotnetVersion)'

          - task: DotNetCoreCLI@2
            displayName: 'dotnet restore'
            inputs:
              command: 'restore'
              projects: 'PopForums.sln'

          - task: DotNetCoreCLI@2
            displayName: 'dotnet build'
            inputs:
              command: 'build'
              projects: 'PopForums.sln'
              arguments: '--configuration $(buildConfiguration) --no-restore'

          - task: DotNetCoreCLI@2
            displayName: 'dotnet test'
            inputs:
              command: 'test'
              projects: 'src/PopForums.Test/PopForums.Test.csproj'
              arguments: '--configuration $(buildConfiguration) --no-build'

          - script: |
              set -e
              VERSION_SUFFIX="ci.$(Build.BuildId)"
              for PROJ in \
                src/PopForums/PopForums.csproj \
                src/PopForums.Sql/PopForums.Sql.csproj \
                src/PopForums.AzureKit/PopForums.AzureKit.csproj \
                src/PopForums.AzureKit.Functions/PopForums.AzureKit.Functions.csproj \
                src/PopForums.ElasticKit/PopForums.ElasticKit.csproj \
                src/PopForums.Mvc/PopForums.Mvc.csproj ; do
                dotnet pack "$PROJ" \
                  --configuration $(buildConfiguration) \
                  --output "$(Build.ArtifactStagingDirectory)/packages" \
                  --version-suffix "$VERSION_SUFFIX" \
                  --no-build \
                  --no-restore
              done
            displayName: 'dotnet pack (6 libraries, no rebuild)'
            condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))

          - script: |
              set -e
              dotnet nuget add source \
                --username $(githubOwner) \
                --password "$(GH_PACKAGES_TOKEN)" \
                --store-password-in-clear-text \
                --name github \
                "https://nuget.pkg.github.com/$(githubOwner)/index.json"
              dotnet nuget push "$(Build.ArtifactStagingDirectory)/packages/*.nupkg" \
                --source github \
                --api-key "$(GH_PACKAGES_TOKEN)" \
                --skip-duplicate
            displayName: 'Push packages to GitHub Packages'
            condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))

          - task: DotNetCoreCLI@2
            displayName: 'dotnet publish PopForums.Web (no rebuild)'
            condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
            inputs:
              command: 'publish'
              projects: 'src/PopForums.Web/PopForums.Web.csproj'
              publishWebProjects: false
              arguments: '--configuration $(buildConfiguration) --no-build --no-restore --output $(Build.ArtifactStagingDirectory)/web'
              zipAfterPublish: true

          - task: DotNetCoreCLI@2
            displayName: 'dotnet publish PopForums.FunctionsHost (no rebuild)'
            condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
            inputs:
              command: 'publish'
              projects: 'src/PopForums.FunctionsHost/PopForums.FunctionsHost.csproj'
              publishWebProjects: false
              arguments: '--configuration $(buildConfiguration) --no-build --no-restore --output $(Build.ArtifactStagingDirectory)/functionshost'
              zipAfterPublish: true

          - publish: '$(Build.ArtifactStagingDirectory)/web'
            artifact: web
            displayName: 'Publish web artifact'
            condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))

          - publish: '$(Build.ArtifactStagingDirectory)/functionshost'
            artifact: functionshost
            displayName: 'Publish functionshost artifact'
            condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))

  - stage: DeployFunctions
    displayName: 'Deploy Functions host'
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: Deploy
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: none

          - download: current
            artifact: functionshost

          - task: AzureFunctionApp@2
            displayName: 'Deploy to Azure Function App'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              appType: 'functionAppLinux'
              isFlexConsumption: true
              appName: '$(functionAppName)'
              package: '$(Pipeline.Workspace)/functionshost/*.zip'

  - stage: DeployWeb
    displayName: 'Deploy web app'
    dependsOn: DeployFunctions
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: Deploy
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: none

          - download: current
            artifact: web

          - task: AzureWebApp@1
            displayName: 'Deploy to Azure Web App'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              appType: 'webApp'
              appName: '$(webAppName)'
              package: '$(Pipeline.Workspace)/web/**/*.zip'
